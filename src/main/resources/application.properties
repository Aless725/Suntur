spring.application.name=Suntur
server.port=8080

# ---- Base de datos ----
# Por defecto MySQL (el esquema y los datos base se crean solos al iniciar).
# Se pueden sobrescribir con variables de entorno: SUNTUR_DB_URL, SUNTUR_DB_USER, SUNTUR_DB_PASSWORD
suntur.db.url=jdbc:mysql://localhost:3306/suntur_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
suntur.db.user=root
suntur.db.password=

# Carga estudiantes, notas y pagos de ejemplo la primera vez (poner false en producción).
suntur.seed-demo=true

# Año académico por defecto (vacío = año actual)
suntur.anio=

# El acceso a datos es JDBC puro (patrón DAO): no se usa JPA ni DataSource de Spring.

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.timeout=30m
